<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de productos</title>
  <style>
    table {
      border-spacing: 8px;
      empty-cells: hide;
    }
    caption {
      caption-side: bottom;
    }
    th, td {
      border: 1px solid black;
      padding: 6px;
    }
    thead th {
      background-color: lightblue;
    }
    tfoot td {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    .categoria {
      vertical-align: top;
    }
  </style>
</head>
<body>
  <!-- empty-cells: hide  -> la celda vacia (el precio de los auriculares) se ve como
       un hueco: no se le dibuja ni borde ni fondo.
       empty-cells: show  -> la celda vacia se dibuja igual que las demas, con su borde.
       Solo funciona con border-spacing (bordes separados), no con border-collapse. -->
  <table>
    <thead>
      <tr>
        <th>Categoría</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio unidad</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="3" class="categoria">Periféricos</td>
        <td>Teclado mecánico</td>
        <td>10</td>
        <td>45,00 €</td>
      </tr>
      <tr>
        <td>Ratón</td>
        <td>15</td>
        <td>20,00 €</td>
      </tr>
      <tr>
        <td>Auriculares</td>
        <td>8</td>
        <td></td>
      </tr>
      <tr>
        <td rowspan="2" class="categoria">Pantallas</td>
        <td>Monitor 24"</td>
        <td>5</td>
        <td>150,00 €</td>
      </tr>
      <tr>
        <td>Monitor 27"</td>
        <td>3</td>
        <td>220,00 €</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Total de unidades</td>
        <td>41</td>
        <td>-</td>
      </tr>
    </tfoot>
    <caption>Inventario de productos de la tienda</caption>
  </table>
</body>
</html>
