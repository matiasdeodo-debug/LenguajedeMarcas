<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UD3.2 ej2 - Formulario con estados</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Alta de usuario · Night City</h1>

  <form action="#" method="post">

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="campo">
      <label for="usuario">Identificador de usuario</label>
      <input type="text" id="usuario" name="usuario" value="edgerunner_042" readonly>
    </div>

    <div class="campo">
      <label for="codigo">Código promocional</label>
      <input type="text" id="codigo" name="codigo" value="No disponible" disabled>
    </div>

    <fieldset>
      <legend>Sexo</legend>
      <input type="radio" id="sexo-h" name="sexo" value="hombre"><label for="sexo-h">Hombre</label>
      <input type="radio" id="sexo-m" name="sexo" value="mujer"><label for="sexo-m">Mujer</label>
      <input type="radio" id="sexo-o" name="sexo" value="otro"><label for="sexo-o">Otro</label>
    </fieldset>

    <fieldset>
      <legend>Aficiones</legend>
      <input type="checkbox" id="af-anime" name="aficiones" value="anime"><label for="af-anime">Anime</label>
      <input type="checkbox" id="af-juegos" name="aficiones" value="videojuegos"><label for="af-juegos">Videojuegos</label>
      <input type="checkbox" id="af-pc" name="aficiones" value="informatica"><label for="af-pc">Informática</label>
      <input type="checkbox" id="af-musica" name="aficiones" value="musica"><label for="af-musica">Música</label>
    </fieldset>

    <button type="submit">Registrarme</button>
  </form>
</body>
</html>
