  <!-- La imagen del queso es LOCAL (img/queso.jpg): en un caso real la
       guardaria en mi propio servidor porque asi siempre carga y no depende
       de otra pagina.
       El sello es REMOTO (URL de internet): lo usaria si es un icono generico
       que no me importa alojar, pero si esa web lo borra o cambia la URL,
       dejaria de verse. -->

  <img src="img/queso.jpg"
       alt="Trozo de queso amarillo con agujeros y cubos de queso sobre una tabla de madera con un cuchillo"
       width="300" height="300"
       style="border: 3px solid black;">

       alt="Sello con la palabra SALE en letras rojas sobre fondo oscuro"
       width="80" height="80">

  <h2>Queso curado artesanal</h2>
  <p><del>12,99 €</del> <strong>8,99 €</strong></p>
